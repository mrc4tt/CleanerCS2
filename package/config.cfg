// Write regular expression in here to prevent them from being printed in the console
// Each line must match the whole message (including the trailing newline), e.g. .*UNEXPECTED LONG FRAME DETECTED.*
//
// @channel:Name          drops every message on a logging channel (e.g. @channel:SteamNetSockets)
// @channel[2]:Name       drops only severity <= 2 (1=detailed 2=message 3=warning), warnings still print
// @block:regex           drops the matching line plus the { ... } dump that follows it on the same channel
// @stderr:regex          Linux only: drops a line written directly to stderr (e.g. by the Steam API), matched without the newline
//
// Use "conclear_debug 1" to see the channel and severity of every message.
//
// Examples:
// @channel:SteamNetSockets
// @block:CSource2Server::ApplyGameSettings game settings payload received:.*
// CPlayerVoiceListener::.*
// @stderr:\[S_API FAIL\] .*
