name: CI

on: [push, pull_request]

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract plugin version from cleanercs2.cpp
        id: extract
        run: |
          VERSION=$(awk '/CleanerPlugin::GetVersion/{f=1} f && /return/{match($0,/"[^"]+"/); print substr($0,RSTART+1,RLENGTH-2); exit}' src/cleanercs2.cpp)
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from src/cleanercs2.cpp" >&2
            exit 1
          fi
          echo "Plugin version: $VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    env:
      HL2SDKCS2: ${{ github.workspace }}/hl2sdk-cs2
      MMSOURCE_DEV: ${{ github.workspace }}/mmsource-2.0
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Push and same-repo PRs build on the VPS runner (msvc-wine in docker,
          # warm re2/abseil cache). Fork PRs never reach a self-hosted runner on a
          # public repo: they keep GitHub's windows-latest.
          - os: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'msvc-wine' || 'windows-latest' }}
            name: Windows
          - os: ubuntu-latest
            name: SteamRT3
            container: ghcr.io/source2ze/build-containers:steamrt3
          - os: ubuntu-latest
            name: SteamRT4
            container: ghcr.io/source2ze/build-containers:steamrt4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: CleanerCS2
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: mrc4tt/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: mrc4tt/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Install xmake
        if: matrix.os == 'windows-latest'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'

      - name: Build
        if: matrix.os != 'msvc-wine'
        working-directory: CleanerCS2
        run: |
          xmake config --mode=release --yes
          xmake --yes
          xmake pack --yes CleanerCS2

      # SDK paths are relative on purpose: link.exe under wine reads an absolute
      # /path argument as a switch and drops the .lib (LNK4044). The toolchain file
      # makes CMake target Windows when xmake builds re2/abseil. The container runs
      # as root, so the workspace is handed back to the runner user either way.
      - name: Build (msvc-wine)
        if: matrix.os == 'msvc-wine'
        run: |
          printf 'set(CMAKE_SYSTEM_NAME Windows)\nset(CMAKE_SYSTEM_PROCESSOR AMD64)\n' > msvc-toolchain.cmake
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w" -v xmake-cache:/root/.xmake -w /w/CleanerCS2 \
            -e XMAKE_ROOT=y \
            -e HL2SDKCS2=../hl2sdk-cs2 -e MMSOURCE_DEV=../mmsource-2.0 \
            -e CMAKE_TOOLCHAIN_FILE=/w/msvc-toolchain.cmake \
            -e PATH=/opt/msvc/bin/x64:/usr/local/bin:/usr/bin:/bin \
            msvc-wine bash -c "rm -rf build .xmake; xmake f -p windows -a x64 -m release --sdk=/opt/msvc -y && xmake -y && xmake pack -y CleanerCS2; status=\$?; chown -R $(id -u):$(id -g) /w; exit \$status"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: CleanerCS2/build/xpack/CleanerCS2

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$SOURCE_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.tag.outputs.exists == 'false'
        uses: actions/download-artifact@v8

      - name: Package
        if: steps.tag.outputs.exists == 'false'
        run: |
          version=${{ steps.tag.outputs.tag }}
          ls -Rall
          if [ -d "./SteamRT3/" ]; then
            cd ./SteamRT3/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt3.tar.gz *
            cd -
          fi
          if [ -d "./SteamRT4/" ]; then
            cd ./SteamRT4/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt4.tar.gz *
            cd -
          fi
          if [ -d "./Windows/" ]; then
            cd ./Windows/
            zip -r ../${{ github.event.repository.name }}-${version}-windows.zip *
            cd -
          fi

      - name: Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ github.event.repository.name }}-*
          fail_on_unmatched_files: true
          generate_release_notes: true
